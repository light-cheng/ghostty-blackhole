<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Desktop Overlay</title>
    <link rel="stylesheet" href="screensaver.css">
</head>
<body>

<!-- WebGL canvas -->
<canvas id="blackhole-canvas"></canvas>

<!-- Exit UI: break countdown, dismissal prompt, IME cells + hidden input -->
<div id="exit-overlay">
    <div id="break-countdown">--:--</div>
    <div id="exit-prompt"></div>
    <div id="exit-input-area"></div>
    <input id="hidden-input" type="text" tabindex="-1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true">
</div>

<!-- Shown only when desktop capture is unavailable; the overlay stays transparent. -->
<div id="capture-error" class="capture-error" hidden></div>

<script type="module" src="screensaver.js"></script>

</body>
</html>
